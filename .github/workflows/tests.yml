name: Tests

on:
  push:
    branches:
      - master
      - main
      - '*.x'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.2, 8.3, 8.4]

    name: Laravel PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  fastapi-unit:
    runs-on: ubuntu-latest
    name: FastAPI unit tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install --no-cache-dir -r fastapi/requirements.txt

      - name: Run unit tests
        working-directory: fastapi
        env:
          NUTRIKIDS_ENABLE_DEV_SEED: 'false'
          NUTRIKIDS_SKIP_CREATE_ALL: '1'
          # Valores efímeros de CI: los tests unitarios no abren conexiones.
          NUTRIKIDS_DATABASE_URL: 'postgresql+psycopg2://test:test@127.0.0.1:5432/nutrikids_test'
          NUTRIKIDS_SECRET_KEY: 'clave-solo-para-tests-no-usar-en-ningun-entorno-real'
        run: pytest tests/unit/ -v

  mobile:
    runs-on: ubuntu-latest
    name: Mobile typecheck and unit tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: NutriKidsMovil/package-lock.json

      - name: Install dependencies
        working-directory: NutriKidsMovil
        run: npm ci

      - name: Typecheck
        working-directory: NutriKidsMovil
        run: npm run typecheck

      - name: Unit tests
        working-directory: NutriKidsMovil
        run: npm test -- --ci
