global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Scrape vía red privada de Railway (*.railway.internal) — sin exponer FastAPI
# ni Prometheus a más superficie pública de la ya necesaria.
scrape_configs:
  - job_name: fastapi
    metrics_path: /metrics
    static_configs:
      - targets:
          - nutrikids-fastapi.railway.internal:8000
