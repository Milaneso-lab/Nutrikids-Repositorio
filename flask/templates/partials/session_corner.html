{% if session.get('rol') == 'padre' %}
<div class="user-menu" id="parentUserMenu">
    <button
        type="button"
        class="user-menu__trigger"
        id="parentUserMenuTrigger"
        aria-expanded="false"
        aria-haspopup="true"
        aria-controls="parentUserMenuPanel"
        aria-label="Abrir menú de cuenta"
    >
        <span class="user-menu__avatar" aria-hidden="true">
            <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" focusable="false">
                <circle cx="20" cy="20" r="19" fill="#e2e8f0" stroke="var(--primary-color, #0a5c54)" stroke-width="2"/>
                <circle cx="20" cy="16" r="6" fill="#64748b"/>
                <path d="M8 34c0-6.6 5.4-12 12-12s12 5.4 12 12" fill="#64748b"/>
            </svg>
        </span>
        <span class="user-menu__bars" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </span>
    </button>

    <div class="user-menu__panel" id="parentUserMenuPanel" role="menu" hidden>
        <div class="user-menu__header">
            <span class="user-menu__avatar user-menu__avatar--large" aria-hidden="true">
                <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" focusable="false">
                    <circle cx="20" cy="20" r="19" fill="#e2e8f0" stroke="var(--primary-color, #0a5c54)" stroke-width="2"/>
                    <circle cx="20" cy="16" r="6" fill="#64748b"/>
                    <path d="M8 34c0-6.6 5.4-12 12-12s12 5.4 12 12" fill="#64748b"/>
                </svg>
            </span>
            <div class="user-menu__identity">
                <p class="user-menu__name">Hola, {{ session.get('nombre', 'Padre') }}{% if session.get('apellido') %} {{ session.get('apellido') }}{% endif %}</p>
                <p class="user-menu__role">Cuenta padre</p>
            </div>
        </div>

        <div class="user-menu__divider" role="separator"></div>

        <a href="{{ url_for('portal_dashboard') }}" class="user-menu__item" role="menuitem">
            <span class="user-menu__item-icon" aria-hidden="true">&#127968;</span>
            Mi portal
        </a>

        <form method="post" action="{{ url_for('logout') }}" class="user-menu__form" role="none">
            <button type="submit" class="user-menu__item user-menu__item--danger" role="menuitem">
                <span class="user-menu__item-icon" aria-hidden="true">&#128682;</span>
                Cerrar sesi&oacute;n
            </button>
        </form>
    </div>
</div>
{% endif %}
